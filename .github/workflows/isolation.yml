name: Security & isolation tests

# Runs the security test suite — token encryption (tests/encryption.test.ts) and
# cross-tenant isolation (tests/isolation.test.ts) — on every push and PR. Make
# this a REQUIRED status check (Settings → Branches → branch protection, and/or
# your Vercel "required checks") so a failure BLOCKS the deployment — an
# encryption or tenant-isolation regression must never ship.

on:
  push:
    branches: ["**"]
  pull_request:

jobs:
  security-tests:
    runs-on: ubuntu-latest

    # The suite is DB-heavy (hundreds of sequential inserts/reads per test). Run
    # it against a throwaway Postgres INSIDE the runner, not a remote database:
    # a remote Neon test DB added ~30–50ms per round-trip, blowing single files
    # out to 3–5 minutes and — combined with Neon compute cold-starts / transient
    # connection drops — causing intermittent silent write/read failures that
    # surfaced as flaky "expected +0" assertions in a DIFFERENT file each run.
    # A local service container is fast, deterministic, and disposable. It is a
    # standard superuser Postgres, so `prisma migrate deploy` can create the
    # `hoteltrack_app` role + RLS policies, and the isolation tests still switch
    # to that non-owner role (SET LOCAL ROLE) to genuinely exercise RLS.
    services:
      postgres:
        image: postgres:17
        env:
          POSTGRES_USER: postgres
          POSTGRES_PASSWORD: postgres
          POSTGRES_DB: hoteltrack_test
        ports:
          - 5432:5432
        options: >-
          --health-cmd pg_isready
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5

    env:
      # Local, ephemeral DB — created fresh for every run, thrown away after.
      DATABASE_URL: postgresql://postgres:postgres@localhost:5432/hoteltrack_test?sslmode=disable

    steps:
      - uses: actions/checkout@v4

      # tests/encryption.test.ts encrypts/decrypts round-trip; lib/encryption.ts
      # needs a valid 64-hex (32-byte) key. This is a PURE THROWAWAY — the tests
      # only round-trip within the run and never touch prod data — so we mint a
      # fresh one at runtime instead of depending on a secret's exact value.
      - name: Mint a throwaway ENCRYPTION_KEY for tests
        run: echo "ENCRYPTION_KEY=$(openssl rand -hex 32)" >> "$GITHUB_ENV"

      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm

      - run: npm ci

      - name: Generate Prisma client
        run: npx prisma generate

      # Ensures the RLS policies + the hoteltrack_app role exist on the test DB
      # (Layer 2 migration). The suite needs them for the DB-level RLS checks.
      - name: Apply migrations
        run: npx prisma migrate deploy

      # Runs ALL test files (tests/**/*.test.ts) — encryption + isolation.
      - name: Run security & isolation suite
        run: npm test
